name: Tests
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact revision to verify before publishing
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build twine pre-commit
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify wheel and source installs
        shell: bash
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            python scripts/verify_install.py "$artifact"
          done
      - run: python scripts/verify_hook.py
