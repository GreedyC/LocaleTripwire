[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "locale-tripwire"
version = "0.1.0"
description = "Detect Unicode key collisions in JSON documents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "GreedyC"}]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/GreedyC/LocaleTripwire"
Issues = "https://github.com/GreedyC/LocaleTripwire/issues"

[project.scripts]
locale-tripwire = "locale_tripwire.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
